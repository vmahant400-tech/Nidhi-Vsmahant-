name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-disabled: true

    - name: Grant Execute Permission
      run: chmod +x gradlew || true

    - name: Fix Missing Cordova Variables
      run: |
        mkdir -p capacitor-cordova-android-plugins
        if [ ! -f capacitor-cordova-android-plugins/cordova.variables.gradle ]; then
          echo "// Auto-generated dummy cordova variables" > capacitor-cordova-android-plugins/cordova.variables.gradle
        fi

    - name: Inject Strict Subproject Variants
      run: |
        if [ -f build.gradle ]; then
          echo "android {" > subproject_fix.gradle
          echo "    buildToolsVersion '34.0.0'" >> subproject_fix.gradle
          echo "}" >> subproject_fix.gradle
          sed -i '/dependencies {/e cat subproject_fix.gradle' build.gradle
          rm subproject_fix.gradle
        fi

    - name: Clean and Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --no-build-cache --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Nidhi-AI-Assistant
        path: app/build/outputs/apk/debug/app-debug.apk
