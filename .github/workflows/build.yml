name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-disabled: true

    - name: Grant Execute Permission
      run: chmod +x gradlew || true

    - name: Create Dummy Web Assets for Offline Build
      run: |
        mkdir -p www
        if [ ! -f www/index.html ]; then
          echo "<html><body><h1>Nidhi AI Assistant</h1></body></html>" > www/index.html
        fi

    - name: Fix Missing Cordova Variables
      run: |
        mkdir -p capacitor-cordova-android-plugins
        if [ ! -f capacitor-cordova-android-plugins/cordova.variables.gradle ]; then
          echo "// Auto-generated dummy cordova variables" > capacitor-cordova-android-plugins/cordova.variables.gradle
        fi

    - name: Fix Subprojects Library Variants for AGP 8
      run: |
        if [ -f build.gradle ]; then
          echo "" >> build.gradle
          echo "subprojects {" >> build.gradle
          echo "    afterEvaluate { project ->" >> build.gradle
          echo "        if (project.hasProperty('android')) {" >> build.gradle
          echo "            project.android {" >> build.gradle
          echo "                if (namespace == null) {" >> build.gradle
          echo "                    namespace project.group" >> build.gradle
          echo "                }" >> build.gradle
          echo "            }" >> build.gradle
          echo "            project.plugins.apply('com.android.library')" >> build.gradle
          echo "        }" >> build.gradle
          echo "    }" >> build.gradle
          echo "}" >> build.gradle
        fi

    - name: Clean and Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --no-build-cache --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Nidhi-AI-Assistant
        path: app/build/outputs/apk/debug/app-debug.apk
