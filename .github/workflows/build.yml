name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle (No Cache)
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-disabled: true

    - name: Grant Execute Permission
      run: chmod +x gradlew || true

    - name: Clean and Build Debug APK
      run: ./gradlew clean assembleDebug --no-daemon --no-build-cache --stacktrace > build_output.log 2>&1

    - name: Upload Build Log on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-error-log
        path: build_output.log

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Nidhi-AI-Assistant
        path: app/build/outputs/apk/debug/app-debug.apk
